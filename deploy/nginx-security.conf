# Include inside the application's server block. Adjust the normal PHP handler separately.
autoindex off;
location ~* ^/(?:config|database|install|docs|tests|bin|deploy|\.git|\.github|\.codex)(?:/|$) { return 404; }
location ~* ^/src/(?:core|inc|module)/.*\.php(?:/|$) { return 404; }
location ~* ^/(?:framework|test)\.php(?:/|$) { return 404; }
location ~* ^/src/(?:debug(?:/.*)?|auth|info|install|setup|handler|auth_handler|sys\.conf)\.php(?:/|$) { return 404; }
location ~* ^/src/debug(?:/|$) { return 404; }
location ~ (?:^|/)\. { return 404; }
location ~* \.(?:sql|sqlite3?|db|log|bak|bnk|zip|pem|key|env|tar|tgz|gz|7z|rar)(?:[.-]|$) { return 404; }
