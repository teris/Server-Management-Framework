# Include inside the application's server block. Adjust the normal PHP handler separately.
autoindex off;
location ~* ^/(?:config|database|install|docs|tests|bin|deploy|integrations|extensions|logs|backups|cache|var|\.git|\.github|\.codex)(?:/|$) { return 404; }
location ~* ^/src/(?:core|inc|module|kernel|setup)/.*\.php(?:/|$) { return 404; }
location ~* ^/(?:framework|test)\.php(?:/|$) { return 404; }
location ~* ^/src/(?:debug(?:/.*)?|auth|info|install|setup|handler|auth_handler|sys\.conf)\.php(?:/|$) { return 404; }
location ~* ^/src/debug(?:/|$) { return 404; }
location ~ (?:^|/)\. { return 404; }
location ~* \.(?:sql|sqlite3?|db|log|bak|bnk|zip|pem|key|env|tar|tgz|gz|7z|rar)(?:[.-]|$) { return 404; }

# Optional shop aliases. Keep REQUEST_URI; the executed PHP entry point is shop.php.
# The enclosing server also needs: index index.php public/index.php;
location ~ ^/(?:gameserver|produkte|konfigurieren|konfigurator|login|registrieren|hilfe|konto|admin|bestellen|paypal|domain-pruefen|module|faq|dokumente|kuendigen)(?:/.*)?$ {
    rewrite ^ /shop.php last;
}
location = /api/paypal/webhook { rewrite ^ /shop.php last; }
location = /api/domain-check { rewrite ^ /shop.php last; }

location = /api/infrastructure/runner { rewrite ^ /shop.php last; }
